<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vérifier un document · ABBA Parcours</title>
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#fbf7ef; --carte:#ffffff; --texte:#2b2a28; --doux:#5b574f; --bleu:#1a3b9a; --or:#c9a227; --trait:#e3d9c0; --ok:#1f7a3d; --ko:#a12a2a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161c; --carte:#1d2029; --texte:#ece8de; --doux:#b8b2a3; --bleu:#8fa8ff; --or:#e0bd4a; --trait:#343846; --ok:#6fd08c; --ko:#ff8c8c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--texte); font:17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 18px 60px; }
  .carte { background:var(--carte); border:1px solid var(--trait); border-radius:16px; padding:22px 20px; }
  img.logo { display:block; width:84px; height:84px; margin:0 auto 8px; }
  h1 { font-size:1.35rem; color:var(--bleu); margin:0 0 6px; text-align:center; }
  p { margin: 8px 0; }
  .doux { color:var(--doux); font-size:.92rem; text-align:center; }
  form { display:flex; gap:8px; margin:18px 0 6px; }
  input { flex:1; min-width:0; padding:12px 14px; font-size:1rem; border:1px solid var(--trait); border-radius:10px; background:var(--bg); color:var(--texte); text-transform:uppercase; }
  button { padding:12px 16px; font-size:1rem; font-weight:600; border:0; border-radius:10px; background:var(--bleu); color:#fff; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { color:#14161c; } }
  .res { margin-top:18px; padding:16px; border-radius:12px; border:2px solid var(--trait); }
  .res.ok { border-color:var(--ok); } .res.ko { border-color:var(--ko); }
  .res h2 { margin:0 0 8px; font-size:1.15rem; } .ok h2 { color:var(--ok); } .ko h2 { color:var(--ko); }
  .nom { font-size:1.25rem; font-weight:700; color:var(--bleu); margin:6px 0; }
  .lang { text-align:center; margin-top:10px; font-size:.9rem; } .lang a { color:var(--bleu); }
  a { color: var(--bleu); }
</style>
</head>
<body>
<main>
<div class="carte">
  <img class="logo" src="logo.png" alt="ABBA">
  <h1 id="t-titre">Vérifier un document ABBA</h1>
  <p class="doux" id="t-aide">Entre le numéro écrit sur l’attestation ou le certificat, ou scanne son QR code.</p>
  <form id="f">
    <input id="n" type="text" placeholder="ABBA-P-XXXX-XXXX" autocomplete="off" autocapitalize="characters" maxlength="20" aria-label="Numéro">
    <button type="submit" id="t-bouton">Vérifier</button>
  </form>
  <div id="res" aria-live="polite"></div>
  <p class="lang"><a href="#" id="lang">English</a></p>
</div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const db = getFirestore(initializeApp(firebaseConfig));
const T = {
  fr: { titre: "Vérifier un document ABBA", aide: "Entre le numéro écrit sur l’attestation ou le certificat, ou scanne son QR code.", bouton: "Vérifier", autre: "English",
        ok: "✅ Document authentique", ko: "❌ Aucun document trouvé avec ce numéro", attente: "Vérification…", erreur: "Impossible de vérifier pour le moment. Réessaie dans un instant.",
        parcours: "Certificat de fin de formation — Parcours Bâtisseur", module: "Attestation de module", delivre: "Date", num: "Numéro",
        aucun: "Vérifie que le numéro est bien recopié (lettres et chiffres, sans espace)." },
  en: { titre: "Verify an ABBA document", aide: "Enter the number written on the attestation or certificate, or scan its QR code.", bouton: "Verify", autre: "Français",
        ok: "✅ Authentic document", ko: "❌ No document found with this number", attente: "Checking…", erreur: "Unable to check right now. Please try again in a moment.",
        parcours: "Training completion certificate — Builder Path", module: "Module attestation", delivre: "Date", num: "Number",
        aucun: "Check that the number is copied correctly (letters and digits, no spaces)." },
};
let lang = /^en/i.test(navigator.language || "") ? "en" : "fr";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function textes() {
  const t = T[lang]; document.documentElement.lang = lang;
  $("t-titre").textContent = t.titre; $("t-aide").textContent = t.aide; $("t-bouton").textContent = t.bouton; $("lang").textContent = t.autre;
}
function dateLongue(iso) {
  const d = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); if (!d) return esc(iso || "");
  return new Date(Date.UTC(+d[1], +d[2] - 1, +d[3])).toLocaleDateString(lang === "en" ? "en-GB" : "fr-FR", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
}
async function verifier(n) {
  const t = T[lang], res = $("res"); n = String(n || "").trim().toUpperCase().replace(/\s+/g, "");
  if (!/^ABBA-P-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(n)) { res.innerHTML = `<div class="res ko"><h2>${t.ko}</h2><p>${t.aucun}</p></div>`; return; }
  res.innerHTML = `<p class="doux">${t.attente}</p>`;
  try {
    const s = await getDoc(doc(db, "attestations", n));
    if (!s.exists()) { res.innerHTML = `<div class="res ko"><h2>${t.ko}</h2><p>${t.aucun}</p></div>`; return; }
    const d = s.data();
    const quoi = d.type === "parcours" ? t.parcours : `${t.module} — ${esc(d.titre)}`;
    res.innerHTML = `<div class="res ok"><h2>${t.ok}</h2><p class="nom">${esc(d.nom)}</p><p>${quoi}</p><p>${t.delivre} : ${dateLongue(d.date)}</p><p class="doux" style="text-align:left;">${t.num} : ${esc(d.numero)}</p></div>`;
  } catch (e) { res.innerHTML = `<div class="res ko"><h2>${t.erreur}</h2></div>`; }
}
$("f").addEventListener("submit", (ev) => { ev.preventDefault(); verifier($("n").value); });
$("lang").addEventListener("click", (ev) => { ev.preventDefault(); lang = lang === "fr" ? "en" : "fr"; textes(); if ($("n").value) verifier($("n").value); });
textes();
const q = new URLSearchParams(location.search).get("n");
if (q) { $("n").value = q.toUpperCase(); verifier(q); }
</script>
</body>
</html>
