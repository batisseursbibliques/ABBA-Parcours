<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon document · ABBA Parcours</title>
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#fbf7ef; --carte:#ffffff; --texte:#2b2a28; --doux:#5b574f; --bleu:#1a3b9a; --trait:#e3d9c0; --ko:#a12a2a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161c; --carte:#1d2029; --texte:#ece8de; --doux:#b8b2a3; --bleu:#8fa8ff; --trait:#343846; --ko:#ff8c8c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--texte); font:17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 14px 50px; text-align:center; }
  h1 { font-size:1.25rem; color:var(--bleu); margin:6px 0 4px; }
  p { margin: 8px 0; } .doux { color:var(--doux); font-size:.92rem; }
  #apercu { width:100%; height:auto; border-radius:8px; border:1px solid var(--trait); margin:12px 0; background:var(--carte); display:none; }
  button { padding:14px 22px; font-size:1.05rem; font-weight:700; border:0; border-radius:12px; background:var(--bleu); color:#fff; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { color:#14161c; } }
  button[disabled] { opacity:.5; }
  .ko { color:var(--ko); font-weight:600; }
  a { color:var(--bleu); }
</style>
</head>
<body>
<main>
  <h1 id="t-titre">Ton document ABBA</h1>
  <p class="doux" id="t-etat">Préparation…</p>
  <img id="apercu" alt="">
  <p><button id="dl" type="button" disabled>Télécharger le PDF</button></p>
  <p class="doux" id="t-aide"></p>
  <p class="doux"><a href="verifier.html" id="t-verif">Vérifier un document</a></p>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { dessiner, telechargerFichier, envNavigateur } from "./attestation.js";

const P = new URLSearchParams(location.search);
const lang = P.get("lang") === "en" ? "en" : "fr", numero = String(P.get("n") || "").trim().toUpperCase();
const T = lang === "en"
  ? { titre: "Your ABBA document", prep: "Preparing…", pret: "Your document is ready.", bouton: "Download the PDF", aide: "If nothing happens, open this page in your browser and try again.", verif: "Verify a document", absent: "Document not found.", erreur: "Unable to prepare the document right now. Please try again." }
  : { titre: "Ton document ABBA", prep: "Préparation…", pret: "Ton document est prêt.", bouton: "Télécharger le PDF", aide: "Si rien ne se passe, ouvre cette page dans ton navigateur et réessaie.", verif: "Vérifier un document", absent: "Document introuvable.", erreur: "Impossible de préparer le document pour le moment. Réessaie dans un instant." };
const $ = (id) => document.getElementById(id);
document.documentElement.lang = lang; $("t-titre").textContent = T.titre; $("t-etat").textContent = T.prep; $("dl").textContent = T.bouton; $("t-aide").textContent = T.aide; $("t-verif").textContent = T.verif;

try {
  if (!/^ABBA-P-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(numero)) throw new Error("absent");
  const s = await getDoc(doc(getFirestore(initializeApp(firebaseConfig)), "attestations", numero));
  if (!s.exists()) throw new Error("absent");
  const rec = s.data();
  const canvas = await dessiner(rec, lang, envNavigateur);
  $("apercu").src = canvas.toDataURL("image/jpeg", 0.8); $("apercu").style.display = "block";
  $("t-etat").textContent = T.pret;
  $("dl").disabled = false;
  $("dl").addEventListener("click", () => telechargerFichier(rec, lang).catch(() => { $("t-etat").textContent = T.erreur; $("t-etat").className = "ko"; }));
} catch (e) {
  $("t-etat").textContent = String(e && e.message) === "absent" ? T.absent : T.erreur; $("t-etat").className = "ko";
}
</script>
</body>
</html>
