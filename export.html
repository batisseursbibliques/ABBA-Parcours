<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Télécharger le fichier · ABBA Parcours</title>
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#fbf7ef; --carte:#ffffff; --texte:#2b2a28; --doux:#5b574f; --bleu:#1a3b9a; --trait:#e3d9c0; --ko:#a12a2a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161c; --carte:#1d2029; --texte:#ece8de; --doux:#b8b2a3; --bleu:#8fa8ff; --trait:#343846; --ko:#ff8c8c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--texte); font:17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px; text-align:center; }
  .carte { background:var(--carte); border:1px solid var(--trait); border-radius:16px; padding:22px 18px; }
  h1 { font-size:1.2rem; color:var(--bleu); margin:0 0 8px; }
  p { margin:8px 0; } .doux { color:var(--doux); font-size:.92rem; } .ko { color:var(--ko); font-weight:600; }
  button { padding:14px 20px; font-size:1.02rem; font-weight:700; border:0; border-radius:12px; background:var(--bleu); color:#fff; cursor:pointer; margin:6px 4px; }
  @media (prefers-color-scheme: dark) { button { color:#14161c; } }
  button.second { background:transparent; color:var(--bleu); border:2px solid var(--bleu); }
</style>
</head>
<body>
<main><div class="carte">
  <h1>Ton fichier est prêt</h1>
  <p id="etat" class="doux">Préparation…</p>
  <p><button id="dl" type="button" disabled>Télécharger le fichier</button></p>
  <p><button id="cp" type="button" class="second" disabled>Copier le tableau</button></p>
  <p class="doux">Ce fichier peut contenir des informations personnelles : ne le partage pas librement. Les données restent dans ton téléphone, elles ne sont envoyées nulle part.</p>
</div></main>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const fin = (msg, ko) => { $("etat").textContent = msg; if (ko) $("etat").className = "ko"; };
  try {
    const m = /^#d=(g|p):(.+)$/.exec(location.hash); if (!m) throw new Error("vide");
    const bin = Uint8Array.from(atob(m[2].replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
    let txt;
    if (m[1] === "g") txt = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    else txt = new TextDecoder().decode(bin);
    const d = JSON.parse(txt);                                  // { n: nom du fichier, c: contenu du tableau, t: version à copier }
    history.replaceState(null, "", location.pathname);          // on efface les données de l'adresse
    fin("Fichier : " + d.n);
    $("dl").disabled = false; if (d.t) $("cp").disabled = false; else $("cp").style.display = "none";
    $("dl").addEventListener("click", () => {
      const type = /\.json$/i.test(d.n) ? "application/json;charset=utf-8" : "text/csv;charset=utf-8";
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([d.c], { type })); a.download = d.n;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    });
    $("cp").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(d.t); $("cp").textContent = "Copié ✓"; } catch (e) { fin("Copie impossible : utilise le téléchargement.", true); }
    });
  } catch (e) { fin("Aucun fichier à télécharger. Retourne dans l'application et appuie de nouveau sur « Télécharger ».", true); }
})();
</script>
</body>
</html>
